<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - SACCO System</title>
    <style>
        :root { 
            --primary: #1e3a8a; 
            --success: #059669; 
            --danger: #dc2626; 
            --bg: #f8fafc; 
            --card-bg: #ffffff; 
            --text: #1e293b; 
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: var(--card-bg); padding: 2rem; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        h2 { margin-top: 0; color: var(--primary); text-align: center; font-size: 1.3rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; color: #334155; }
        input { width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 4px; font-family: inherit; font-size: 0.9rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background-color: var(--primary); border: none; color: white; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: 600; margin-top: 0.5rem; }
        button:hover { background-color: #1d4ed8; }
        .flash { background: #fee2e2; border-left: 4px solid var(--danger); padding: 10px 15px; margin-bottom: 1rem; border-radius: 4px; color: #991b1b; font-size: 0.9rem; }
        .back-link { display: block; text-align: center; margin-top: 1rem; color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2>Change Password</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('change_password') }}" method="POST">
        <div class="form-group">
            <label for="current_password">Current Password</label>
            <input type="password" id="current_password" name="current_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit">Update Password</button>
    </form>

    <a href="{{ url_for('admin') if user.username == 'admin' else url_for('dashboard') }}" class="back-link">Back to Dashboard</a>
</div>

</body>
</html>
