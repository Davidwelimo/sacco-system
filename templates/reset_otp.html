<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; }
        input { width: 100%; padding: 10px; margin: 8px 0 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .flash { color: red; font-size: 0.85em; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h3 style="text-align: center; margin-top: 0;">Reset Password with OTP</h3>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" action="/reset_password_otp">
            <label>Username</label>
            <input type="text" name="username" required>
            <label>6-Digit OTP</label>
            <input type="text" name="otp" required>
            <label>New Password</label>
            <input type="password" name="new_password" required>
            <button type="submit">Reset Password</button>
        </form>
        <div style="text-align:center; margin-top:15px;"><a href="/login">Back to Login</a></div>
    </div>
</body>
</html>
