<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
</head>
<body>
    <h2>Reset Password with OTP</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul>{% for msg in messages %}<li>{{ msg }}</li>{% endfor %}</ul>
      {% endif %}
    {% endwith %}
    <form method="POST">
        <label>Username:</label><input type="text" name="username" required><br>
        <label>OTP Code:</label><input type="text" name="otp" required><br>
        <label>New Password:</label><input type="password" name="new_password" required><br>
        <button type="submit">Reset Password</button>
    </form>
    <p><a href="{{ url_for('login') }}">Back to Login</a></p>
</body>
</html>
