<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Role</title>
</head>
<body>
    <h2>Welcome, {{ user.username }}</h2>
    <p>Your assigned role is: <strong>{{ user.role }}</strong></p>
    <form method="POST">
        <button type="submit">Proceed to Dashboard</button>
    </form>
    {% if user.role in ['System Admin', 'Chairman', 'Finance', 'HR & Secretary Manager', 'ICT Director'] %}
        <p><a href="{{ url_for('admin') }}">Go to Admin Panel</a></p>
    {% endif %}
    <p><a href="{{ url_for('logout') }}">Logout</a></p>
</body>
</html>
